DISTRO = "symonos"
DISTRO_NAME = "SyMoNeuRaL OS"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "symoneural-core"
SDK_VENDOR = "-symoneuralsdk"
MAINTAINER = "Garrett McDonald <your-email@symoneural.com>"

# --- Architecture & Packaging ---
TARGET_VENDOR = "-symoneural"

PACKAGE_CLASSES ?= "package_ipk"

# --- Init System (Systemd Focus) ---
DISTRO_FEATURES:append = " systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
VIRTUAL-RUNTIME_initscripts = ''

# --- Distro Features ---
# Cleaned up the duplicates and added standard essentials

# --- SDK Policy ---
SDK_NAME = "${DISTRO}-${SDKMACHINE}-${IMAGE_BASENAME}-${MACHINE}"
SDKPATH = "/opt/${DISTRO}/${DISTRO_VERSION}"

# --- Image Policy ---
IMAGE_FSTYPES += "tar.zst ext4 wic"

# --- Quality Assurance & Security ---
ERROR_QA = "version-going-backwards"
require conf/distro/include/security_flags.inc
require conf/distro/include/yocto-uninative.inc
require conf/distro/include/no-static-libs.inc
INHERIT += "uninative symoneural-sanity"
