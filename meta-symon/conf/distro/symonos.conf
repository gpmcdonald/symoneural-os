DISTRO = "symonos"
DISTRO_NAME = "SyMoNeuRaL OS"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "symoneural-core"
SDK_VENDOR = "-symoneuralsdk"
MAINTAINER = "Garrett McDonald <your-email@symoneural.com>"

# --- Architecture & Packaging ---
TARGET_VENDOR = "-symoneural"
LOCALCONF_VERSION = "2"
PACKAGE_CLASSES ?= "package_ipk package_deb"

# --- Init System (Systemd Focus) ---
INIT_MANAGER = "systemd"
# Consideration for usrmerge is required for modern systemd
DISTRO_FEATURES:append = " systemd usrmerge pam"
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# --- Distro Features ---
# Cleaned up the duplicates and added standard essentials
DISTRO_FEATURES = "${DISTRO_FEATURES_DEFAULT} \
                   argp largefile usbhost wifi xattr nfs pci \
                   x11 opengl wayland vulkan pulseaudio \
                   multiarch ${DISTRO_FEATURES_LIBC}"

# --- Kernel Policy ---
# We use a weak assignment (?=) so the Machine/BSP can override this
# (Important for your Antminer/Zynq builds)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.6%"

# --- SDK Policy ---
SDK_NAME = "${DISTRO}-${SDKMACHINE}-${IMAGE_BASENAME}-${MACHINE}"
SDKPATH = "/opt/${DISTRO}/${DISTRO_VERSION}"

# --- Extra Dependencies ---
DISTRO_EXTRA_RDEPENDS += "packagegroup-core-boot"
DISTRO_EXTRA_RRECOMMENDS += "kernel-module-af-packet"

# --- Image Policy ---
IMAGE_FSTYPES += "tar.zst ext4 wic"

# --- Quality Assurance & Security ---
ERROR_QA = "version-going-backwards"
require conf/distro/include/security_flags.inc
require conf/distro/include/yocto-uninative.inc
require conf/distro/include/no-static-libs.inc
INHERIT += "uninative symoneural-sanity"

# --- Brand Identity ---
SYMONOS_BRANDING = "1"
DISTRO_FEATURES:append = " symoneural-branding"
