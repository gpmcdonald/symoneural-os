# MODEL: NVIDIA RTX 50-Series Workstation
# TARGET: Generic x86-64 with Bleeding Edge Drivers

MACHINE = "generic-x86-64"
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "kernel-module-nvidia nvidia-utils"
PREFERRED_VERSION_nvidia-open-kernel-modules = "590.%"
LICENSE_FLAGS_ACCEPTED += "commercial_nvidia"
