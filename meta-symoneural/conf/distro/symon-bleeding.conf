DISTRO = "symon-bleeding"
DISTRO_NAME = "SyMoNeuRaL Bleeding Edge (Experimental)"

# Policy: Latest possible kernel for new hardware (RTX 50-series)
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
