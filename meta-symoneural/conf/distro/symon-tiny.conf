require conf/distro/include/gcsections.inc

DISTRO = "symon-tiny"
DISTRO_NAME = "SymonOS Tiny"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "genesis"

MAINTAINER = "Symoneural Maintainer <garrett@symoneural.com>"
TARGET_VENDOR = "-symoneural"
SDK_VENDOR = "-symoneuralsdk"

TCLIBC = "musl"
FULL_OPTIMIZATION = "-Os -pipe ${DEBUG_FLAGS}"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto-tiny"
PREFERRED_VERSION_linux-yocto-tiny ?= "6.12%"

DISTRO_FEATURES = "pci ipv4 ipv6 usbhost largefile"

DISTRO_FEATURES:class-native = "pci ipv4 ipv6 usbhost largefile x11 opengl wayland"
DISTRO_FEATURES:class-nativesdk = "pci ipv4 ipv6 usbhost largefile x11 opengl wayland"

INIT_MANAGER = "mdev-busybox"
VIRTUAL-RUNTIME_dev_manager = "busybox-mdev"
VIRTUAL-RUNTIME_init_manager = "busybox"
VIRTUAL-RUNTIME_initscripts = "initscripts"

ENABLE_WIDEC = "false"
ENABLE_WIDEC:class-native = "true"
USE_NLS = "no"
IMAGE_LINGUAS = ""

SYMONEURAL_DEFAULT_EXTRA_RRECOMMENDS = ""
MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""

IMAGE_FSTYPES = "cpio.gz wic"
QB_DEFAULT_FSTYPE = "cpio.gz"

SKIP_RECIPE[core-image-sato] = "not buildable with symon-tiny"
SKIP_RECIPE[core-image-weston] = "not buildable with symon-tiny"
SKIP_RECIPE[core-image-x11] = "not buildable with symon-tiny"

PACKAGECONFIG:remove:pn-opkg-utils = "python"
PACKAGE_EXCLUDE += "shadow-base"

LOCALCONF_VERSION = "2"
LAYER_CONF_VERSION ?= "8"
