# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-symoneural"
BBFILE_PATTERN_meta-symoneural = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-symoneural = "6"

LAYERDEPENDS_meta-symoneural = "core"
LAYERSERIES_COMPAT_meta-symoneural = "scarthgap"
