# MODEL: Alienware Aurora R11 (Symoneural Custom)
# CPU: Intel Core i9-10900KF
# GPU: NVIDIA RTX 5070 Ti
# EXTRAS: AlienFX LED Controller

MACHINE = "generic-x86-64"

# --- KERNEL MODULES FOR R11 ---
# These allow the OS to see the LEDs and Sensors
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "kernel-module-alienware-wmi kernel-module-dell-smm-hwmon"
KERNEL_MODULE_AUTOLOAD += "alienware-wmi dell-smm-hwmon"

# --- NVIDIA DRIVERS ---
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "kernel-module-nvidia nvidia-utils"
PREFERRED_VERSION_nvidia-open-kernel-modules = "590.%"
LICENSE_FLAGS_ACCEPTED += "commercial_nvidia"
